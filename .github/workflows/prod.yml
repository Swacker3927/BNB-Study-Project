name: Prod distribute

on:
  push:
    branches: [ prod ]

jobs:
  build:
    runs-on: ubuntu-lastest

    steps:
      - name: Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.IP }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secret.SSH_PORT }}
          script:
            cd /home/ubuntu/apps/BNB-Study-Project
            git pull
            sudo docker compose up -d --build
